<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" font-family="Verdana, 'DejaVu Sans', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="560" fill="#f4f1ea"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#20201c">8BitDo Zero 2 &#8212; keymap</text>
  <text x="40" y="63" font-size="12" fill="#6b6960" font-family="Menlo, 'DejaVu Sans Mono', monospace">Wispr Flow + Claude Code &#183; keyboard mode</text>

  <rect x="40" y="90" width="300" height="420" rx="54" fill="#fffdf8" stroke="#ddd8cc" stroke-width="1.5"/>

  <!-- D-pad -->
  <circle cx="128" cy="132" r="21" fill="#e0eef0" stroke="#3a93a6" stroke-width="1.2"/>
  <circle cx="128" cy="202" r="21" fill="#e0eef0" stroke="#3a93a6" stroke-width="1.2"/>
  <circle cx="93"  cy="167" r="21" fill="#e0eef0" stroke="#3a93a6" stroke-width="1.2"/>
  <circle cx="163" cy="167" r="21" fill="#e0eef0" stroke="#3a93a6" stroke-width="1.2"/>

  <!-- select / start -->
  <circle cx="206" cy="252" r="12" fill="#ece9e0" stroke="#c9c4b8" stroke-width="1"/>
  <circle cx="254" cy="252" r="12" fill="#ece9e0" stroke="#c9c4b8" stroke-width="1"/>
  <text x="230" y="284" text-anchor="middle" font-size="9" fill="#9a9588" font-family="Menlo, 'DejaVu Sans Mono', monospace">select &#183; start</text>

  <!-- Face -->
  <circle cx="230" cy="318" r="26" fill="#e1efe7" stroke="#2f9e79" stroke-width="1.2"/>
  <circle cx="178" cy="360" r="26" fill="#e1efe7" stroke="#2f9e79" stroke-width="1.2"/>
  <circle cx="282" cy="360" r="26" fill="#e1efe7" stroke="#2f9e79" stroke-width="1.2"/>
  <circle cx="230" cy="402" r="26" fill="#e1efe7" stroke="#2f9e79" stroke-width="1.2"/>

  <!-- Side -->
  <rect x="312" y="140" width="70" height="44" rx="12" fill="#f7ddd1" stroke="#d2693f" stroke-width="1.2"/>
  <rect x="312" y="348" width="70" height="44" rx="12" fill="#f7ddd1" stroke="#d2693f" stroke-width="1.2"/>

  <!-- labels -->
  <g text-anchor="middle" font-family="Menlo, 'DejaVu Sans Mono', monospace">
    <text x="128" y="126" font-size="8.5" fill="#9a9588">e</text>
    <text x="128" y="139" font-size="12" fill="#16545f">&#8593;</text>
    <text x="128" y="196" font-size="8.5" fill="#9a9588">f</text>
    <text x="128" y="209" font-size="12" fill="#16545f">&#8595;</text>
    <text x="93"  y="161" font-size="8.5" fill="#9a9588">d</text>
    <text x="93"  y="174" font-size="12" fill="#16545f">&#8592;</text>
    <text x="163" y="161" font-size="8.5" fill="#9a9588">c</text>
    <text x="163" y="174" font-size="12" fill="#16545f">&#8594;</text>

    <text x="230" y="312" font-size="8.5" fill="#9a9588">i</text>
    <text x="230" y="325" font-size="11" fill="#114a39">Apps</text>
    <text x="178" y="354" font-size="8.5" fill="#9a9588">j</text>
    <text x="178" y="367" font-size="11" fill="#114a39">Hands</text>
    <text x="282" y="354" font-size="8.5" fill="#9a9588">h</text>
    <text x="282" y="367" font-size="11" fill="#114a39">Win</text>
    <text x="230" y="396" font-size="8.5" fill="#9a9588">g</text>
    <text x="230" y="409" font-size="11" fill="#114a39">Term</text>

    <text x="347" y="157" font-size="8.5" fill="#9a9588">k &#183; index</text>
    <text x="347" y="171" font-size="11" fill="#7d3417">Talk</text>
    <text x="347" y="359" font-size="8.5" fill="#9a9588">m &#183; ring</text>
    <text x="347" y="372" font-size="10.5" fill="#7d3417">Enter</text>
    <text x="347" y="385" font-size="8" fill="#7d3417">hold: Apps&#9656;</text>
  </g>

  <!-- legend -->
  <g font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b6960">
    <rect x="40"  y="528" width="13" height="13" rx="3" fill="#e0eef0" stroke="#3a93a6"/>
    <text x="60"  y="538">Arrows</text>
    <rect x="150" y="528" width="13" height="13" rx="3" fill="#e1efe7" stroke="#2f9e79"/>
    <text x="170" y="538">Face / thumb</text>
    <rect x="300" y="528" width="13" height="13" rx="3" fill="#f7ddd1" stroke="#d2693f"/>
    <text x="320" y="538">Side: index k, ring m</text>
  </g>
</svg>
